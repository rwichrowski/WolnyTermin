spring:
  application:
    name: wolnytermin

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wolnytermin}
    username: ${DB_USER:wolnytermin}
    password: ${DB_PASSWORD:wolnytermin}

  jpa:
    hibernate:
      # Schemat tworzy wylacznie Flyway. Hibernate ma go tylko weryfikowac —
      # nigdy nie ustawiaj tu 'update', bo rozjedzie sie z migracjami.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Warsaw

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    pl.wolnytermin: DEBUG
